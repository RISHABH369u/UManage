spring:
  application:
    name: umanage-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/umanage}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    cors:
      allowed-origins:
        - ${APP_CORS_ALLOWED_ORIGIN:http://localhost:*}
    jwt:
      issuer: ${JWT_ISSUER:umanage}
      # Default is for local development only. Override in all non-local envs.
      secret: ${JWT_SECRET:YmFzZTY0LXNlY3JldC1rZXktd2l0aC1lbm91Z2gtbGVuZ3RoLXRvLWJlLXNlY3VyZS0xMjM0NQ==}
      access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:30}
      refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@umanage.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
